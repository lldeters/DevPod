name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build -- --production
      - name: Smoke-test the built bundle
        run: npm run test:smoke
      - name: Package VSIX
        run: npx vsce package --out devcontainers-kiro.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: devcontainers-kiro-vsix
          path: devcontainers-kiro.vsix

  e2e:
    name: End-to-end with Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        env:
          DCK_E2E: '1'

  e2e-kubernetes:
    name: End-to-end with Kubernetes (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create a throw-away cluster
        run: |
          command -v kind >/dev/null || {
            curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
            chmod +x kind && sudo mv kind /usr/local/bin/kind
          }
          kind version
          kubectl version --client
          kind create cluster --wait 180s
          kubectl get nodes
      - run: npm run test:e2e:k8s
        env:
          DCK_E2E_K8S: '1'
