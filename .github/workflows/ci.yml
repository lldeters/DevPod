name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build -- --production
      - name: Smoke-test the built bundle
        run: npm run test:smoke
      - name: Package VSIX
        run: npx vsce package --out devcontainers-kiro.vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devcontainers-kiro-vsix
          path: devcontainers-kiro.vsix

  e2e:
    name: End-to-end with Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        env:
          DCK_E2E: '1'

  e2e-kubernetes:
    name: End-to-end with Kubernetes (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create a throw-away cluster
        run: |
          command -v kind >/dev/null || {
            curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64
            # kind-linux-amd64.sha256sum of the v0.27.0 release
            echo 'a6875aaea358acf0ac07786b1a6755d08fd640f4c79b7a2e46681cc13f49a04b  kind' | sha256sum -c -
            chmod +x kind && sudo mv kind /usr/local/bin/kind
          }
          kind version
          kubectl version --client
          kind create cluster --wait 180s
          kubectl get nodes
      - run: npm run test:e2e:k8s
        env:
          DCK_E2E_K8S: '1'
