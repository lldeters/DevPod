name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build -- --production
      - name: Smoke-test the built bundle
        run: npm run test:smoke
      - name: Package VSIX
        run: npx vsce package --out devcontainers-kiro.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: devcontainers-kiro-vsix
          path: devcontainers-kiro.vsix

  e2e:
    name: End-to-end with Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        env:
          DCK_E2E: '1'
