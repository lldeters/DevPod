name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # The release workflow runs the whole CI, end-to-end tests included, before it publishes.
  workflow_call:

permissions:
  contents: read

# Dependencies are installed without their install scripts (nothing here needs them): one way less
# for a compromised package to run code in the job that builds the VSIX which may be published.

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build -- --production
      - name: Smoke-test the built bundle
        run: npm run test:smoke
      - name: Package VSIX
        run: npx vsce package --out devcontainers-kiro.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devcontainers-kiro-vsix
          path: devcontainers-kiro.vsix

  e2e:
    name: End-to-end with Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:e2e
        env:
          DCK_E2E: '1'

  e2e-kubernetes:
    name: End-to-end with Kubernetes (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Create a throw-away cluster
        run: |
          command -v kind >/dev/null || {
            curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64
            # kind-linux-amd64.sha256sum of the v0.27.0 release
            echo 'a6875aaea358acf0ac07786b1a6755d08fd640f4c79b7a2e46681cc13f49a04b  kind' | sha256sum -c -
            chmod +x kind && sudo mv kind /usr/local/bin/kind
          }
          kind version
          kubectl version --client
          kind create cluster --wait 180s
          kubectl get nodes
      - run: npm run test:e2e:k8s
        env:
          DCK_E2E_K8S: '1'
