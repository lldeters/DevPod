name: Release

# Publishes the extension to Open VSX when a tag v<version> is pushed, or created by publishing a
# release in the GitHub UI. It publishes the VSIX that the full CI (including the Docker and
# Kubernetes end-to-end tests) built and tested for that commit. Needs the repository secret
# OVSX_PAT; see docs/RELEASING.md. No checkout keeps the token in .git/config, and no dependency
# install script runs where the write token or OVSX_PAT is used.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Check tag, version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match version $version in package.json."
            exit 1
          fi
          if ! grep -Eq "^## $version \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md needs the heading '## $version (YYYY-MM-DD)' for this release."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to Open VSX and create the GitHub release
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub release
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Only ovsx is needed here, and it needs no install scripts; this job may write releases.
      - run: npm ci --ignore-scripts
      - name: Fetch the VSIX that CI built and tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: devcontainers-kiro-vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::The repository secret OVSX_PAT (an Open VSX access token) is not set."
            exit 1
          fi
          # --skip-duplicate keeps a re-run working when Open VSX already has this version.
          npx ovsx publish --packagePath devcontainers-kiro.vsix --skip-duplicate
      - name: Create or complete the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are the changelog section of this version.
          awk -v heading="## $VERSION " 'index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit } found' CHANGELOG.md > notes.md
          cp devcontainers-kiro.vsix "devcontainers-kiro-$VERSION.vsix"
          # A release published in the GitHub UI creates the tag that started this run: attach the
          # VSIX to it, and keep its notes unless it has none. A re-run finds its own release.
          if body="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body 2>/dev/null)"; then
            gh release upload "$GITHUB_REF_NAME" "devcontainers-kiro-$VERSION.vsix" --clobber
            if [ -z "$body" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" "devcontainers-kiro-$VERSION.vsix" \
              --title "$VERSION" --notes-file notes.md
          fi
